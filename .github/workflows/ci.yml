name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    name: Test (Node ${{ matrix.node }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: [20, 22, 24]
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: pnpm typecheck
      - run: pnpm test
      - name: Build docs
        run: pnpm --filter react-zpl-docs build
      - name: Export example labels
        # Runs the built CLI directly: pnpm only links the react-zpl command
        # when packages/cli/dist exists at install time.
        working-directory: examples/shipping-label
        run: node ../../packages/cli/dist/index.js export --svg --out ${{ runner.temp }}/labels
