name: Release

# Uses changesets: merging PRs with changeset files opens a "Version packages"
# PR. Merging that PR stages the new versions on npm (npm stage publish), and a
# maintainer approves them with 2FA on npmjs.com under Staged Packages.
#
# NPM_TOKEN is a granular token with "Read and write (stage only)" access.

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write        # push version commits and tags
      pull-requests: write   # open the "Version packages" PR
      id-token: write        # npm provenance
    env:
      NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          registry-url: https://registry.npmjs.org
      - name: Use npm 11 (npm stage needs 11.15 or later)
        run: npm install -g npm@11
      - run: pnpm install --frozen-lockfile
      - name: Skip publishing until the NPM_TOKEN secret is set
        if: env.NPM_TOKEN == ''
        run: echo "::warning::NPM_TOKEN secret is not set, so nothing was published."
      - name: Create release PR or stage new versions
        if: env.NPM_TOKEN != ''
        uses: changesets/action@v1
        with:
          version: pnpm run version-packages
          publish: pnpm run release
          title: Version packages
          commit: Version packages
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          NPM_CONFIG_PROVENANCE: true
